name: Link Claude lifecycle data
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-lifecycle-links.yml]
permissions:
  contents: write
concurrency:
  group: ng-lifecycle-links
  cancel-in-progress: false
env:
  CODE_REV: 3f3eace1fff166c412dd31f5a57bf68d684e75b2
  RED_REV: b4d24996f9a036e179a97fa21feb3c19db68d6c9
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow==20.0.0 numpy==2.2.6
      - name: Clock contract tests and exact source joins
        run: |
          mkdir -p code red results/validation
          for f in link.py link_io.py external.py verify.py test_links.py README.md; do
            curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/lifecycle-links/$f" -o "code/$f"
          done
          for f in test_links.py link_io.py; do
            curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$RED_REV/agent-pass/lifecycle-links/$f" -o "red/$f"
          done
          set +e
          (cd red && python -m unittest -v test_links.py) > results/validation/red.txt 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -q NotImplementedError results/validation/red.txt
          (cd code && python -m unittest -v test_links.py) 2>&1 | tee results/validation/green.txt
          cp code/README.md results/README.md
          python -u code/link.py --output results
          python -u code/verify.py results
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-data-links
          path: results
  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      OUTPUT_PATH: tasks/family-research-20261022/lifecycle-data-links/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: lifecycle-data-links
          path: ${{ env.OUTPUT_PATH }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "data: attach lifecycle clocks, event parents and informational context"
          git pull --rebase origin codex/native-dipole-artifacts-20261108
          git push origin HEAD:codex/native-dipole-artifacts-20261108

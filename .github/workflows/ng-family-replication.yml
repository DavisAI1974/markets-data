name: Recover remaining family analysis inputs
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-family-replication.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUTPUT_PATH: tasks/family-research-20261022/family-replication/probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install zstandard==0.25.0
      - name: Inspect sealed archive schema
        run: |
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/1969612e8c88a75902df6bf11d6cda2148069dd8/agent-pass/replication/probe_family_archive.py" -o "$RUNNER_TEMP/probe_family_archive.py"
          python -u "$RUNNER_TEMP/probe_family_archive.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-source-probe
          path: ${{ env.OUTPUT_PATH }}
      - name: Publish source inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "Preserve sealed ROOT family source inspection"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

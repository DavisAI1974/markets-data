name: Four-date combined event studies
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-combined-events.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ng-combined-events
  cancel-in-progress: false
env:
  CODE_REV: 5f694cf768b9f1937fed1e4e8fd6160578510726
  MPLBACKEND: Agg
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        day: ['20231002', '20231003', '20231017', '20231018']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 pyarrow==20.0.0 zstandard==0.25.0 sortedcontainers==2.4.0 databento
      - name: Run pinned combined study stage
        run: |
          for script in finish_family_replication.py combined_event_sources.py; do
            curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/replication/$script" -o "$RUNNER_TEMP/$script"
          done
          python -u "$RUNNER_TEMP/combined_event_sources.py" --day "${{ matrix.day }}" --output "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: events-${{ matrix.day }}
          path: ${{ runner.temp }}/results
  publish:
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    env:
      OUTPUT_PATH: tasks/family-research-20261022/combined-events/run-${{ github.run_id }}-${{ github.run_attempt }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: events-*
          path: ${{ env.OUTPUT_PATH }}
      - name: Preserve evidence and actual job statuses
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["OUTPUT_PATH"]);p.mkdir(parents=True,exist_ok=True)
          (p/"RUN_STATUS.json").write_text(json.dumps({"code_revision":os.environ["CODE_REV"],"jobs":json.loads(os.environ["JOB_RESULTS"])},indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "Preserve combined event study stage and exact status"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

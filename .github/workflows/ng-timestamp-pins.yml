name: Timestamp pins for 99 layers and 13 inputs
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-timestamp-pins.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ng-timestamp-pins
  cancel-in-progress: false
env:
  CODE_REV: 4b773dadcd0a90ca89b47c178293ab974a125f80
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow==20.0.0
      - name: Confirm timestamp regression tests expose missing implementation
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP"
          for file in pin_core.py test_pin_core.py; do
            curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/pinning/$file" -o "$file"
          done
          set +e
          python -m unittest -v test_pin_core > results/red-tests.txt 2>&1
          result=$?
          set -e
          cat results/red-tests.txt
          test "$result" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-inventory
          path: ${{ runner.temp }}/results
  publish:
    if: always()
    needs: [inspect]
    runs-on: ubuntu-latest
    env:
      OUTPUT_PATH: tasks/family-research-20261022/timestamp-pins/run-${{ github.run_id }}-${{ github.run_attempt }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: source-inventory
          path: ${{ env.OUTPUT_PATH }}
      - run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["OUTPUT_PATH"]);p.mkdir(parents=True,exist_ok=True)
          (p/"RUN_STATUS.json").write_text(json.dumps({"code_revision":os.environ["CODE_REV"],"jobs":json.loads(os.environ["JOB_RESULTS"])},indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "data: preserve original timestamp pin input inventory"
          git pull --rebase origin codex/native-dipole-artifacts-20261108
          git push origin HEAD:codex/native-dipole-artifacts-20261108

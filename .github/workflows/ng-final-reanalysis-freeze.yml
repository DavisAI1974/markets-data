name: Freeze final shared reanalysis inputs
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-final-reanalysis-freeze.yml]
permissions:
  contents: write
concurrency:
  group: ng-final-reanalysis-freeze
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODE_REV: bb019f3fc4ab7e7f207aa5ba32c8f982c31140f4
      OUTPUT_PATH: tasks/family-research-20261022/shared-reanalysis-inputs/final-${{ github.run_id }}-${{ github.run_attempt }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - name: Freeze final complete source packet
        run: |
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/reanalysis/freeze_final_inputs.py" -o /tmp/freeze_final_inputs.py
          python /tmp/freeze_final_inputs.py "$OUTPUT_PATH"
      - name: Publish shared frozen manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "research: freeze full identical evidence for independently complete analyses"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

name: Verify timed October 2 checkpoint
on:
  push:
    branches: [codex/frankie-four-day-audit-20261109]
    paths: [.github/workflows/verify-second-set-checkpoint.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frankie-second-set-probe
  cancel-in-progress: false
jobs:
  october-02:
    if: github.repository == 'DavisAI1974/markets-data' && github.ref == 'refs/heads/codex/frankie-four-day-audit-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DavisAI1974/Markets
          ref: '7f34afaf6c9011ed7061f3989d52c70e98740402'
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /markets_adapter.py
            /research/refrag/__init__.py
            /research/refrag/qsv_registry.py
            /research/__init__.py
            /research/kalshi/__init__.py
            /research/ng_exhaustion_mbo_v4_state_adapter_20260820.py
            /research/kalshi/frankie_boss/*.py
            /research/kalshi/frankie_boss/SPEC-c15-teacher-r3.md
            /research/kalshi/frankie_boss/four_day_pins/
            /research/kalshi/frankie_boss/parallel_r3_contracts/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 pyarrow==22.0.0
      - name: Compare resumed and uninterrupted October 2 replay
        run: |
          module=research.kalshi.frankie_boss.four_day_pins.recover_second_set
          python -u -m "$module" "$RUNNER_TEMP/continuous" --limit 1200
          python -u -m "$module" "$RUNNER_TEMP/checkpoint" --limit 1200 --max-seconds 0.001
          digest=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["checkpoint_sha256"])' "$RUNNER_TEMP/checkpoint/RECOVERY_RECEIPT.json")
          test "$digest" != None
          python -u -m "$module" "$RUNNER_TEMP/resumed" --limit 1200 --resume-from "$RUNNER_TEMP/checkpoint" --resume-sha256 "$digest"
          python - <<'PY'
          import gzip, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def rows(directory):
              return b''.join(gzip.decompress(p.read_bytes()) for p in sorted(directory.glob('second-set-*.jsonl.gz')))
          continuous = rows(root / 'continuous')
          resumed = rows(root / 'resumed')
          assert len(continuous.splitlines()) == 1200 and continuous == resumed
          a, b = [json.loads((root / d / 'RECOVERY_RECEIPT.json').read_text()) for d in ('continuous', 'resumed')]
          assert a['metrics'] == b['metrics'] and a['state_counts'] == b['state_counts']
          print('Timed stop and resume matched all 1,200 rows, counts and 19 calculation states.')
          PY

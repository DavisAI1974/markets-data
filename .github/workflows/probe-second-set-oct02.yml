name: Probe October 2 replay throughput
on:
  push:
    branches: [codex/frankie-four-day-audit-20261109]
    paths: [.github/workflows/probe-second-set-oct02.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frankie-second-set-probe
  cancel-in-progress: false
jobs:
  october-02:
    if: github.repository == 'DavisAI1974/markets-data' && github.ref == 'refs/heads/codex/frankie-four-day-audit-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DavisAI1974/Markets
          ref: '0aa27d766d794a9d542ecdca7596efce1c458112'
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /markets_adapter.py
            /research/refrag/__init__.py
            /research/refrag/qsv_registry.py
            /research/__init__.py
            /research/kalshi/__init__.py
            /research/ng_exhaustion_mbo_v4_state_adapter_20260820.py
            /research/kalshi/frankie_boss/*.py
            /research/kalshi/frankie_boss/SPEC-c15-teacher-r3.md
            /research/kalshi/frankie_boss/four_day_pins/
            /research/kalshi/frankie_boss/parallel_r3_contracts/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 pyarrow==22.0.0
      - name: Time 8,000 consecutive October 2 messages
        run: |
          python -u -m research.kalshi.frankie_boss.four_day_pins.recover_second_set "$RUNNER_TEMP/throughput-probe" --limit 8000
          cat "$RUNNER_TEMP/throughput-probe/RECOVERY_RECEIPT.json"

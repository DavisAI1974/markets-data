name: Codex trade environment application
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-codex-trade-environment.yml]
permissions:
  contents: write
concurrency:
  group: ng-codex-trade-environment
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODE_REV: 2165358e5b8caabdd0e88b2ce1ffdcfbbf96ff83
      OUTPUT_PATH: tasks/family-research-20261022/codex-trade-environment/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - name: Install saved-data readers
        run: pip install numpy pyarrow openpyxl pandas matplotlib
      - name: Apply findings to saved trade environments
        run: |
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/reanalysis/codex/source_review.py" -o /tmp/source_review.py
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/reanalysis/codex/apply_trade_environments.py" -o /tmp/apply_trade_environments.py
          python -m py_compile /tmp/apply_trade_environments.py
          python /tmp/apply_trade_environments.py "$OUTPUT_PATH"
      - name: Publish saved-evidence application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "research: apply findings across full trade environments"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

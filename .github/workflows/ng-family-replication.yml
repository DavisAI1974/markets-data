name: Recover remaining family analysis inputs
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-family-replication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ng-family-replication
  cancel-in-progress: false
env:
  CODE_REV: 59195f9339c48cfcbd4a6bf9916a935a4da4fb1d
  MPLBACKEND: Agg
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        day: ['20231002', '20231003', '20231017', '20231018']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 pyarrow==20.0.0 zstandard==0.25.0
      - name: Resume saved verified inputs and check unchanged October 18 results
        run: |
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/replication/finish_family_replication.py" -o "$RUNNER_TEMP/finish_family_replication.py"
          python -u "$RUNNER_TEMP/finish_family_replication.py" resume --day "${{ matrix.day }}" --output "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-${{ matrix.day }}
          path: ${{ runner.temp }}/results
  publish:
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    env:
      OUTPUT_PATH: tasks/family-research-20261022/family-replication/run-${{ github.run_id }}-${{ github.run_attempt }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: family-*
          path: ${{ env.OUTPUT_PATH }}
      - name: Record exact completion status
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["OUTPUT_PATH"])
          p.mkdir(parents=True,exist_ok=True)
          (p/"RUN_STATUS.json").write_text(json.dumps({"code_revision":os.environ["CODE_REV"],"jobs":json.loads(os.environ["JOB_RESULTS"])},indent=2))
          PY
      - name: Preserve all returned evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "Preserve family replication evidence and actual completion status"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

name: Recover October 2 Frankie second set
on:
  push:
    branches: [codex/frankie-four-day-audit-20261109]
    paths: [.github/workflows/recover-second-set-oct02.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frankie-second-set-recovery
  cancel-in-progress: false
jobs:
  segment_1:
    if: github.repository == 'DavisAI1974/markets-data' && github.ref == 'refs/heads/codex/frankie-four-day-audit-20261109'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 1
      seconds: 75
  segment_2:
    needs: segment_1
    if: needs.segment_1.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 2
      seconds: 7200
      previous: 1
      previous_sha256: ${{ needs.segment_1.outputs.checkpoint_sha256 }}
  segment_3:
    needs: segment_2
    if: needs.segment_2.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 3
      seconds: 7200
      previous: 2
      previous_sha256: ${{ needs.segment_2.outputs.checkpoint_sha256 }}
  segment_4:
    needs: segment_3
    if: needs.segment_3.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 4
      seconds: 7200
      previous: 3
      previous_sha256: ${{ needs.segment_3.outputs.checkpoint_sha256 }}
  segment_5:
    needs: segment_4
    if: needs.segment_4.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 5
      seconds: 7200
      previous: 4
      previous_sha256: ${{ needs.segment_4.outputs.checkpoint_sha256 }}
  segment_6:
    needs: segment_5
    if: needs.segment_5.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 6
      seconds: 7200
      previous: 5
      previous_sha256: ${{ needs.segment_5.outputs.checkpoint_sha256 }}
  segment_7:
    needs: segment_6
    if: needs.segment_6.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 7
      seconds: 7200
      previous: 6
      previous_sha256: ${{ needs.segment_6.outputs.checkpoint_sha256 }}
  segment_8:
    needs: segment_7
    if: needs.segment_7.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 8
      seconds: 7200
      previous: 7
      previous_sha256: ${{ needs.segment_7.outputs.checkpoint_sha256 }}
  segment_9:
    needs: segment_8
    if: needs.segment_8.outputs.complete == 'false'
    uses: ./.github/workflows/frankie-second-set-segment.yml
    with:
      segment: 9
      seconds: 7200
      previous: 8
      previous_sha256: ${{ needs.segment_8.outputs.checkpoint_sha256 }}
  publish:
    needs: [segment_1, segment_2, segment_3, segment_4, segment_5, segment_6, segment_7, segment_8, segment_9]
    if: ${{ !cancelled() && contains(needs.*.outputs.complete, 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-second-set-20231002
          path: second-set
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the pinned verified packet publisher
        run: curl --fail --retry 3 -sS 'https://raw.githubusercontent.com/DavisAI1974/Markets/7f34afaf6c9011ed7061f3989d52c70e98740402/research/kalshi/frankie_boss/four_day_pins/publish_verified_packet.py' -o publisher.py
      - name: Save the verified October 2 result in Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python publisher.py second-set "codex/frankie-second-set-20231002-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "tasks/family-research-20261022/frankie-four-day-pins/second-set-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/20231002"

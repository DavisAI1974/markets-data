name: Codex independent analysis ledgers
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-codex-analysis-ledgers.yml]
permissions:
  contents: write
concurrency:
  group: ng-codex-analysis-ledgers
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CODE_REV: 41a209fbcfcf2a8fca15ad3e80b7124ca0c1db55
      BRIEF_REV: 64f599312106537d83a23fc65447dd2db0e6ca95
      OUTPUT_PATH: tasks/family-research-20261022/codex-independent-analysis/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - name: Install readers
        run: pip install numpy pyarrow openpyxl
      - name: Assemble saved-evidence interpretation ledgers
        run: |
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/reanalysis/codex/source_review.py" -o /tmp/source_review.py
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/reanalysis/codex/assemble_review.py" -o /tmp/assemble_review.py
          python -m py_compile /tmp/source_review.py /tmp/assemble_review.py
          python /tmp/assemble_review.py "$OUTPUT_PATH"
      - name: Save independent analysis ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "research: preserve independent complete evidence accounting and price feedback"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

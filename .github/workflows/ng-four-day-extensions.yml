name: Complete four-date NG extensions
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-four-day-extensions.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ng-four-day-extensions
  cancel-in-progress: false
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CODE_REV: c4ca63f2816a50e051f70f6219f2378bd9530777
      OUTPUT_PATH: tasks/family-research-20261022/four-day-extensions/run-${{ github.run_id }}-${{ github.run_attempt }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned analysis code
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ng-extension-code"
          for name in finish_four_day_extensions.py research_atlas_continuous.py research_atlas_primer.py test_extensions.py; do
            curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/replication/$name" -o "$RUNNER_TEMP/ng-extension-code/$name"
          done
      - name: Install analysis dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 matplotlib==3.10.3 pytest==8.4.2
      - name: Test, reproduce October 18, then finish the other dates
        run: python -u "$RUNNER_TEMP/ng-extension-code/finish_four_day_extensions.py" --output "$OUTPUT_PATH"
      - name: Preserve run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ng-four-day-extensions
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: warn
      - name: Publish verified results to markets-data
        shell: bash
        run: |
          test -f "$OUTPUT_PATH/MANIFEST.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "Publish verified four-day precursor and primer replications"
          git push origin HEAD:codex/native-dipole-artifacts-20261108

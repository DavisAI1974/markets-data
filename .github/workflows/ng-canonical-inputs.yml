name: Reconcile shared research inputs
on:
  push:
    branches: [codex/native-dipole-artifacts-20261108]
    paths: [.github/workflows/ng-canonical-inputs.yml]
permissions:
  contents: write
concurrency:
  group: ng-canonical-inputs
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODE_REV: 239666bae4e33ec386a7004d7b988f1629962605
      OUTPUT_PATH: tasks/family-research-20261022/shared-reanalysis-inputs/run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-dipole-artifacts-20261108
          sparse-checkout: .github
      - name: Compare definitions and deduplicate source coordinates
        run: |
          curl --fail --retry 3 -sS "https://raw.githubusercontent.com/DavisAI1974/Markets/$CODE_REV/agent-pass/reanalysis/reconcile_inputs.py" -o /tmp/reconcile_inputs.py
          python /tmp/reconcile_inputs.py "$OUTPUT_PATH"
      - name: Publish preparation manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$OUTPUT_PATH"
          git commit -m "data: unify registry bindings and remove duplicate input aliases; analysis on hold"
          git pull --rebase origin codex/native-dipole-artifacts-20261108
          git push origin HEAD:codex/native-dipole-artifacts-20261108
